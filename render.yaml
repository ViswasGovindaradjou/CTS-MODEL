services:
  - type: web
    name: healthsync-fastapi-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: health_platform
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: JWT_SECRET_KEY
        value: super-secret-key-change-in-production-chronic-health-2026
      - key: CORS_ORIGINS
        value: '["https://healthsync-ai-platform.vercel.app","http://localhost:5173","http://localhost:3000"]'
